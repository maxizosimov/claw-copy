name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; the workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Security checks
        run: ./scripts/check-security.sh

      - name: Unit tests
        run: swift test

      - name: Build and sign app bundle
        run: ./scripts/build-app.sh

      - name: Verify the app bundle has no entitlements
        run: |
          ents="$(codesign -d --entitlements - "build/Claw Copy.app" 2>/dev/null || true)"
          echo "$ents"
          if echo "$ents" | grep -q '<key>'; then
            echo "Unexpected entitlements" >&2
            exit 1
          fi

      - name: Verify the binary links no low-level networking or web frameworks
        run: |
          libs="$(otool -L "build/Claw Copy.app/Contents/MacOS/ClawCopy")"
          echo "$libs"
          if echo "$libs" | grep -Ei 'Network\.framework|WebKit|JavaScriptCore'; then
            echo "Network.framework or a web framework is linked into the app" >&2
            exit 1
          fi
