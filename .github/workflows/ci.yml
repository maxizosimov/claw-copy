name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Read-only token; the workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the outdated run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No AI-tool attribution in commits or PR text
        env:
          # Passed as env vars so untrusted PR text is never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-attribution.sh "$BASE_SHA" "$HEAD_SHA"

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Security checks
        run: ./scripts/check-security.sh

      - name: Unit tests
        run: swift test

      - name: Build and sign app bundle
        run: ./scripts/build-app.sh

      - name: Verify the app bundle has no entitlements
        run: |
          ents="$(codesign -d --entitlements - "build/Claw Copy.app" 2>/dev/null || true)"
          echo "$ents"
          if echo "$ents" | grep -q '<key>'; then
            echo "Unexpected entitlements" >&2
            exit 1
          fi

      - name: Verify the binary links no networking frameworks
        run: |
          libs="$(otool -L "build/Claw Copy.app/Contents/MacOS/ClawCopy")"
          echo "$libs"
          if echo "$libs" | grep -Ei 'Network\.framework|CFNetwork|WebKit|JavaScriptCore'; then
            echo "Networking or web framework linked into the app" >&2
            exit 1
          fi
